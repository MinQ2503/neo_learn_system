<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neo Learn System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9', // Sky blue/Teal
                600: '#0284c7',
                900: '#0c4a6e',
              },
              accent: {
                500: '#f97316', // Orange
              },
              clay: {
                bg: '#f3f4f6', // gray-100
              }
            },
            boxShadow: {
              'clay': '8px 8px 16px #d1d5db, -8px -8px 16px #ffffff',
              'clay-inset': 'inset 8px 8px 16px #d1d5db, inset -8px -8px 16px #ffffff',
              'clay-sm': '4px 4px 8px #d1d5db, -4px -4px 8px #ffffff',
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #f3f4f6; /* Matching clay bg */
        color: #1f2937;
      }
      /* Hide scrollbar for clean look in panels */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>

}
</script>
